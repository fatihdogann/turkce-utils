name: Publish

# Publishes to npm using OIDC trusted publishing — no long-lived npm token.
#
# One-time setup on npmjs.com (package → Settings → Trusted publishing):
#   Provider:            GitHub Actions
#   Organization or user: fatihdogann
#   Repository:          turkce-utils
#   Workflow filename:   publish.yml
#   Allowed actions:     npm publish
#
# After that, pushing a `v*` tag publishes that version. Nothing here runs on
# an ordinary push to main.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `npm publish --dry-run` instead of publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for OIDC; npm exchanges this for a short-lived token

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14.0.
      - name: Ensure a trusted-publishing capable npm
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Verify (typecheck + tests)
        run: |
          npm run typecheck
          node --test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --access public

      # Trusted publishing from GitHub Actions attaches a provenance attestation
      # automatically — no --provenance flag needed.
      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`$(node -p "require('./package.json').version")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`$GITHUB_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/turkce-utils" >> "$GITHUB_STEP_SUMMARY"
